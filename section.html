<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Függőségek</title>
  <style>
    *{box-sizing:border-box;}
    body{
      margin:0; padding:10px 4px 14px;
      font:13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color:#172b4d;
    }
    .group{ margin-bottom:16px; }
    .group:last-of-type{ margin-bottom:6px; }
    .group label{
      display:block; font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.03em; color:#5e6c84; margin-bottom:6px;
    }
    .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      background:#f4f5f7; border:1px solid #dfe1e6; border-radius:12px;
      padding:3px 6px 3px 10px; font-size:12.5px; line-height:1.4; color:#172b4d;
    }
    .chip-x{
      border:none; background:#dfe1e6; color:#42526e; border-radius:50%;
      width:16px; height:16px; line-height:1; font-size:12px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; padding:0;
    }
    .chip-x:hover{ background:#c1c7d0; }
    .field-wrap{ position:relative; }
    input[type=text]{
      width:100%; font:inherit; font-size:13px; padding:7px 9px;
      border:2px solid #dfe1e6; border-radius:4px; color:#172b4d; background:#fafbfc;
    }
    input[type=text]:focus{ outline:none; border-color:#4c9aff; background:#fff; }
    .suggestions{
      position:absolute; left:0; right:0; top:calc(100% + 2px); z-index:10;
      background:#fff; border:1px solid #dfe1e6; border-radius:4px;
      box-shadow:0 4px 8px rgba(9,30,66,.15); max-height:190px; overflow-y:auto;
    }
    .suggestion{
      padding:7px 10px; cursor:pointer; font-size:12.5px; color:#172b4d;
      border-bottom:1px solid #f4f5f7;
    }
    .suggestion:last-child{ border-bottom:none; }
    .suggestion:hover{ background:#e4f0f6; }
    .suggestion .list-name{ color:#5e6c84; font-size:11px; }
    .empty-note{ font-size:12px; color:#5e6c84; margin-bottom:6px; }
    .error{
      margin-top:4px; font-size:12px; color:#bf2600; background:#ffebe6;
      border-radius:4px; padding:6px 8px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="group">
      <label>Blocking</label>
      <div class="chips" id="blocking-chips"></div>
      <div class="field-wrap">
        <input type="text" id="blocking-search" autocomplete="off"
          placeholder="Keress kártyát, amit ez blokkol…">
        <div class="suggestions" id="blocking-suggestions"></div>
      </div>
    </div>

    <div class="group">
      <label>Blocked by</label>
      <div class="chips" id="blockedby-chips"></div>
      <div class="field-wrap">
        <input type="text" id="blockedby-search" autocomplete="off"
          placeholder="Keress kártyát, ami ezt blokkolja…">
        <div class="suggestions" id="blockedby-suggestions"></div>
      </div>
    </div>

    <div class="error" id="error" hidden></div>
  </div>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./section.js"></script>
</body>
</html>
